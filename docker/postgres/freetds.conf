[global]
    tds version = 7.4
    client charset = UTF-8
    connect timeout = 5
    timeout = 15
    encryption = require

[sqlserver]
    host = sqlserver
    port = 1433
    tds version = 7.4
    encryption = require
# TLS obligatorio, certificado autoemitido de laboratorio sin CA verificada.
# Configurar ca file y validación de hostname antes de salir de la red local.
# No activar TDSDUMP: puede exponer información sensible.