# Solo laboratorio local: red Docker interna y sin puertos publicados por defecto.
listen_addresses = '*'
port = 5432
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
max_connections = 50
shared_buffers = '128MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
# No registrar sentencias: los USER MAPPING pueden contener credenciales.
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = 'panic'
# TLS PostgreSQL y MongoDB pendiente; no usar esta configuración fuera del laboratorio.
ssl = off