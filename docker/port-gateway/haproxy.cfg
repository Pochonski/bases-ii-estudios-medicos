global
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

# Solo visible dentro del contenedor; Docker no publica 8404.
frontend backend_readiness
    mode http
    bind 127.0.0.1:8404
    monitor-uri /ready
    monitor fail if { nbsrv(pg_internal) lt 1 } || { nbsrv(sql_internal) lt 1 } || { nbsrv(mongo_internal) lt 1 }

frontend pg_local
    bind *:5432
    default_backend pg_internal

backend pg_internal
    server postgres postgres:5432 check

frontend sql_local
    bind *:1433
    default_backend sql_internal

backend sql_internal
    server sqlserver sqlserver:1433 check

frontend mongo_local
    bind *:27017
    default_backend mongo_internal

backend mongo_internal
    server mongodb mongodb:27017 check
